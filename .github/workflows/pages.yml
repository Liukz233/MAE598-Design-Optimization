name: Deploy Project 4 site

on:
  push:
    branches: [main]
    paths:
      - "projects/04_engineering_design/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the Project 4 site with Jekyll (GitHub Pages versions)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./projects/04_engineering_design/site
          destination: ./_site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
