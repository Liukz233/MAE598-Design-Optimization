<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<script>
  window.MathJax = { tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  :root { --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --line: #d1d9e0; --panel: #f6f8fa; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { line-height: 1.25; margin-top: 0.4em; }
  h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.2em; margin-top: 1.8em; }
  img { max-width: 100%; height: auto; }
  a { color: #0969da; }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 4px 10px; }
  td:last-child { white-space: nowrap; }
  th { background: var(--panel); }
  code { background: var(--panel); padding: 1px 4px; border-radius: 4px; font-size: 90%; }
  pre { background: var(--panel); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
  pre code { padding: 0; }
  mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

  .viewer { position: relative; border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 16px 0 6px; }
  .v-wait { color: var(--muted); margin: 0; }
  .v-controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; margin-bottom: 8px; }
  .v-controls label { display: flex; align-items: center; gap: 6px; }
  .v-controls .v-grow { flex: 1 1 220px; }
  .v-controls .v-grow input { flex: 1; min-width: 80px; }
  .v-controls select, .v-controls button { font: inherit; padding: 3px 8px; }
  .v-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .v-panel { min-width: 0; }
  .v-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .v-host { width: 100%; background: var(--panel); border-radius: 4px; overflow: hidden; }
  .v-host canvas { display: block; touch-action: none; }
  .v-metrics table { width: 100%; margin-top: 6px; font-size: 13px; }
  .v-metrics td { padding: 2px 6px; }
  .v-metrics tr.ok td:last-child { color: #1a7f37; font-weight: 600; }
  .v-metrics tr.bad td:last-child { color: #b42318; font-weight: 700; }
  .v-legend { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .v-bar-wrap { position: relative; margin: 0 40px 34px 12px; }
  .v-bar { height: 12px; border: 1px solid var(--line); border-radius: 2px; }
  .v-ticks { position: relative; height: 0; }
  .v-tick { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--fg); }
  .v-tick::before { content: ""; position: absolute; left: 50%; top: -16px; height: 16px; border-left: 1px solid #000; }
  .v-tick:nth-child(n+3) { top: 16px; }
  .v-tip { position: absolute; z-index: 5; max-width: 300px; background: #fff; border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 9px; font-size: 13px; line-height: 1.4; pointer-events: none;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .caption { color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) {
    .v-panels { grid-template-columns: 1fr; }
    body { font-size: 15px; }
  }
</style>
</head><body><main>
{{content}}
</main>
<script type="module" src="assets/viewer.js"></script>
</body></html>
